<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>光影实验室｜点光源投影</title>
  <link rel="stylesheet" href="styles/main.css">
  <script defer src="assets/motion-data.js"></script>
  <script defer src="scripts/scenes.js"></script>
  <script defer src="scripts/motion.js"></script>
  <script defer src="scripts/svg-stage.js"></script>
  <script defer src="scripts/moving-light.js"></script>
  <script defer src="scripts/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <div class="mark" aria-hidden="true">✦</div>
        <div>
          <strong>光影实验室</strong>
          <small>点光源投影</small>
        </div>
      </div>
      <nav aria-label="选择演示">
        <a href="#rod" data-scene="rod"><span aria-hidden="true">╱</span>旋转木棒</a>
        <a href="#triangle" data-scene="triangle"><span aria-hidden="true">△</span>旋转三角形</a>
        <a href="#walk" data-scene="walk"><span aria-hidden="true">↔</span>灯下行走</a>
        <a href="#moving-light" data-scene="moving-light"><span aria-hidden="true">☀</span>移动点光源</a>
      </nav>
    </aside>
    <main>
      <header>
        <div>
          <div class="kicker" id="index"></div>
          <h1 id="title"></h1>
          <p id="description"></p>
        </div>
      </header>
      <section class="frame" aria-labelledby="title">
        <div class="stage" id="stage"></div>
        <p class="stage-status" id="stage-status" role="status" hidden></p>
        <div class="legend" id="legend"></div>
      </section>
      <section class="dock" aria-label="动画控制">
        <div class="controller">
          <button id="play" type="button" disabled></button>
          <div class="slider-wrap">
            <label for="slider" id="slider-label"></label>
            <input id="slider" type="range" disabled>
          </div>
          <output id="dial" for="slider"></output>
          <div class="slider-wrap light-slider-wrap" id="light-slider-wrap" hidden>
            <label for="light-slider">光源左右位置</label>
            <input id="light-slider" type="range" disabled>
          </div>
          <output id="light-dial" for="light-slider" hidden></output>
        </div>
        <div class="details">
          <div class="measure" id="measure">
            <span>木棒 <b id="body-length"></b></span>
            <span>投影 <b id="shadow-length"></b></span>
          </div>
          <div class="states" id="states"></div>
        </div>
        <p class="hint">拖动即暂停；点「继续播放」从当前位置继续。</p>
      </section>
    </main>
  </div>
</body>
</html>
